<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sissejuhatus programmeerimisse</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      line-height: 1.6;
    }

    main {
      max-width: 820px;
      margin: 40px auto;
      padding: 36px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    h1,
    h2 {
      color: #155e75;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 2.4rem;
    }

    .subtitle {
      margin-top: 0;
      color: #475569;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .assignment-list {
      padding: 0;
      list-style: none;
    }

    .assignment-list li {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
    }

    .assignment-list a {
      color: #0e7490;
      font-weight: 700;
      text-decoration: none;
    }

    .assignment-list a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 32px;
      color: #475569;
    }

    @media (max-width: 700px) {
      main {
        margin: 16px;
        padding: 24px;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sissejuhatus programmeerimisse</h1>
    <p class="subtitle">Kätlin Tootmaa</p>
    <p>Siia kogun selle aine ülesanded ja harjutused.</p>

    <section aria-labelledby="ulesanded">
      <h2 id="ulesanded">Ülesanded</h2>
      <ul class="assignment-list">
        <li>
          <a href="tutvustusleht/">Tutvustusleht</a>
          <p>Lihtne HTML-leht, mis tutvustab mind ja kasutab korrektset HTML-struktuuri.</p>
        </li>
      </ul>
    </section>

    <footer>
      <p>Lehe autor: Kätlin Tootmaa</p>
    </footer>
  </main>
</body>
</html>
